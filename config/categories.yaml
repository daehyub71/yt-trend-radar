# 카테고리 체계 — 확장형 (SPEC FR-1)
#
# 이 파일이 카테고리의 단일 진실이다. 코드 수정 없이 항목을 추가/변경할 수 있다.
# 분류 로직(P3, engine/classifier)은 이 정의를 읽어 동작하며, 키워드 튜닝도 여기서 한다.
#
# 매칭 규칙:
#   - keywords 중 하나라도 제목/태그/설명에 있으면 후보 점수 +weight
#   - exclude 에 걸리면 해당 카테고리에서 제외
#   - 최고 점수 카테고리로 배정, 동점/무득점이면 미분류(NULL) → 랭킹에 노출되지 않음
#   - channels.category_override 가 있으면 항상 그 값이 우선 (수동 교정)

version: 1

# --- region 축: 국내 / 해외 -------------------------------------------------
# ⚠️ 의미 확정 필요 (P3 전) — 현재는 subject(콘텐츠 소재) 기준으로 설정되어 있다.
#    strategy: subject  → "해외여행 브이로그"(한국인 채널)는 '해외'로 분류
#    strategy: origin   → 채널 국가코드(KR) 기준. "해외"는 외국 채널
#    strategy: subject 실패 시 origin 을 폴백으로 사용한다.
region_axis:
  strategy: subject
  fallback: origin
  regions:
    - id: domestic
      name: 국내
      origin_countries: [KR]
      keywords: [국내, 한국, 서울, 부산, 제주, 강원, 경주, 전주, 대구, 인천, 광주, 대전, 속초, 여수, 국내여행, 한식, 로컬]
    - id: overseas
      name: 해외
      keywords: [해외, 일본, 도쿄, 오사카, 베트남, 다낭, 태국, 방콕, 대만, 타이베이, 유럽, 파리, 이탈리아, 스페인, 미국, 뉴욕, LA, 중국, 상하이, 홍콩, 싱가포르, 필리핀, 세부, 몽골, 호주, 해외여행, 유럽여행]

# --- 대분류 (SPEC D3: 초기 5개) --------------------------------------------
categories:
  - id: food
    name: 음식
    weight: 1.0
    # 구체 음식명을 넉넉히 넣는다 — 요리 채널은 '요리'라는 단어 없이 음식명만 쓴다
    # (실측: cho.eat 은 '어묵볶음·삼계탕·파스타'만 써서 20%로 탈락했다)
    keywords: [먹방, 맛집, 요리, 레시피, 음식, 디저트, 카페, 베이커리, 빵집, 제빵, 술, 소주, 맥주, 와인, 위스키, 안주,
               편의점, 밀키트, 밀프랩, 식당, 식품, 냉동식품, 간식, 반찬, 밥도둑, 도시락, 분식, 한끼, 자취요리,
               리뷰먹방, 쿡방, 백반, 라면, 치킨, 회, 고기, 빵, 커피, 국수, 파스타, 삼계탕, 국밥, 찌개, 김치,
               떡볶이, 볶음, 구이, 조림, 무침, 과자, 아이스크림, 먹어보기, 맛평가]
    exclude: [게임, 광고문의만]
    # discovery_queries: 채널 검색(type=channel)용 head 질의 — 대형 채널이 주로 잡힌다
    discovery_queries: [먹방, 맛집 리뷰, 요리 레시피]
    # discovery_queries_niche: 최근 인기영상(type=video, order=viewCount)용 롱테일 질의.
    #   "권위 있는 채널"이 아니라 "최근에 터진 채널"을 찾는 경로 — 소형 채널 발굴의 핵심.
    discovery_queries_niche: [자취 요리, 혼밥, 편의점 신상, 동네 맛집]

  - id: travel
    name: 여행
    weight: 1.0
    # 캠핑·차박은 travel 소관 — 캠핑 영상은 음식 이야기가 많아 food 에 뺏기기 쉽다
    keywords: [여행, 브이로그여행, 관광, 관광지, 항공, 비행기, 호텔, 리조트, 숙소, 숙박, 캠핑, 캠핑장, 차박, 글램핑,
               백패킹, 배낭여행, 로드트립, 기차여행, 투어, 온천, 공항, 여행코스, 여행지, 당일치기, 주말여행, 휴가,
               여름휴가, 국도, 드라이브, 렌터카, 자유여행, 패키지여행, 1박2일, 명소, 야경, 해변, 유럽, 동남아, 일본여행]
    exclude: []
    discovery_queries: [여행 브이로그, 해외여행, 국내여행]
    discovery_queries_niche: [당일치기 여행, 소도시 여행, 자유여행 코스, 차박 캠핑]

  # tech 는 '하드웨어·기기 리뷰' 로 좁힌다 — AI·코딩은 aicoding 카테고리 소관.
  # (개발/코딩/AI 키워드를 여기 남겨두면 aicoding 콘텐츠를 tech 가 흡수한다)
  - id: tech
    name: IT·테크
    weight: 1.0
    # ⚠️ '리뷰'·'언박싱'은 제거했다 — 모든 카테고리가 쓰는 일반어라 tech 가 남의 콘텐츠를
    #    훔쳐간다 (실측: 편의점 채널 CU 가 '신상리뷰' 때문에 tech 9/15 로 판정됐다).
    #    기기 정체성은 구체 제품군 이름으로 싣는다.
    keywords: [IT, 테크, 스마트폰, 아이폰, 갤럭시, 노트북, 맥북, 태블릿, 이어폰, 헤드폰, 모니터, 키보드, 마우스,
               PC, 조립, 가전, 카메라, 앱추천, 스마트워치, 충전기, 공유기, 그래픽카드, 콘솔, 로봇청소기, 프로젝터]
    exclude: [게임플레이, 바이브코딩, 프롬프트]
    discovery_queries: [IT 리뷰, 스마트폰 리뷰, 노트북 언박싱]
    discovery_queries_niche: [기계식 키보드, 가성비 노트북, 스마트홈 구축, 무선 이어폰 비교]

  - id: aicoding
    name: 바이브코딩·AI
    weight: 1.1   # tech 와 겹치는 소재(개발·AI 기기)에서는 이쪽이 우선
    keywords: [바이브코딩, 바이브 코딩, vibe coding, 클로드코드, Claude Code, 커서, Cursor, 코파일럿, Copilot, ChatGPT, GPT, 제미나이, Gemini, LLM, 프롬프트, 프롬프트 엔지니어링, AI 코딩, AI 개발, AI 툴, AI 에이전트, 에이전트, MCP, RAG, 파인튜닝, 생성AI, 생성형 AI, 인공지능, 미드저니, 스테이블디퓨전, 개발, 코딩, 프로그래밍, 자동화, n8n, 노코드]
    exclude: [게임플레이]
    discovery_queries: [바이브코딩, AI 코딩, 클로드 코드]
    discovery_queries_niche: [커서 AI 사용법, 클로드코드 활용, 프롬프트 엔지니어링, n8n 자동화]

  - id: vlog
    name: 브이로그·일상
    weight: 0.9   # 가장 포괄적 — 다른 카테고리에 밀리도록 가중치를 낮춘다
    keywords: [브이로그, vlog, 일상, 데일리, 하루, 직장인, 자취, 원룸, 살림, 정리, 인테리어, 육아, 반려견, 반려묘,
               고양이, 강아지, 주말, 루틴, 미니멀, 삼시세끼, 출근, 퇴근, 프리랜서, 워킹맘, 신혼, 자취방, 청소, 빨래]
    exclude: []
    discovery_queries: [일상 브이로그, 자취 브이로그, 직장인 브이로그]
    discovery_queries_niche: [원룸 자취 브이로그, 퇴사 브이로그, 시골 생활, 육아 브이로그]

  - id: fitness
    name: 운동·건강
    weight: 1.0
    # 등산 채널은 '등산'이라 안 쓰고 '지리산 암릉 코스·100대명산 완등'이라 쓴다 (실측).
    # 영어 제목 피트니스 채널(MIZI 등)을 위해 영어 용어도 넣는다 — ASCII 는 단어 경계 매칭이다.
    keywords: [운동, 헬스, 헬스장, 홈트, 다이어트, 감량, 체중감량, 스트레칭, 요가, 필라테스, 러닝, 마라톤,
               클라이밍, 수영, 등산, 산행, 등반, 명산, 완등, 종주, 암릉, 트레킹, 산악, 근력, 체지방, 식단,
               건강, 자세교정, 크로스핏, 골프, 스쿼트, 플랭크, 복근, 코어, 하체, 상체, 유산소, 인터벌, 타바타,
               데드리프트, 벤치프레스, 턱걸이, 푸시업, 바디프로필, 재활,
               workout, fitness, stretching, cardio, HIIT, abs, squat, plank, pilates, yoga,
               # 등산 영상 제목은 산 이름만 쓰는 경우가 많다 — 주요 명산은 유한하므로 열거한다
               지리산, 설악산, 북한산, 한라산, 관악산, 팔공산, 무등산, 소백산, 태백산, 오대산,
               치악산, 계룡산, 도봉산, 청계산, 덕유산, 속리산, 월악산, 백운대, 대청봉]
    exclude: []
    discovery_queries: [홈트, 다이어트 운동, 헬스 운동법]
    discovery_queries_niche: [홈트 초보, 러닝 입문, 필라테스 초보, 등산 코스]
