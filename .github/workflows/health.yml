name: health

# 수집 신선도 감시자. **collect 워크플로와 독립적으로** 돈다 —
# cron 이 통째로 멈춘 상황을 collect 안의 점검은 잡아낼 수 없기 때문이다.
# 실패하면 GitHub 이 저장소 소유자에게 메일을 보낸다(기본 알림).
on:
  schedule:
    - cron: '30 */6 * * *'   # 6시간마다
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      DB_MODE: live
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: 수집 신선도 (12시간 기준)
        run: python tools/check_freshness.py --max-age-hours 12
