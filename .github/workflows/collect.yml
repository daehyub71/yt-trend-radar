name: collect

# 하루 3회 수집 → 지수 산출 → 보관정책 → 시드 검증 → 리포트 (PLAN §4b)
#
# cron 은 UTC 다. 00/08/16 KST = 15/23/07 UTC (전날 15시, 전날 23시, 당일 07시).
# GitHub Actions 무료 티어의 cron 은 수 분~수십 분 밀린다 — 지수 산출이 Δt 를 실측하므로
# 지연돼도 결과는 맞는다 (PLAN §6 리스크 대응).
on:
  schedule:
    - cron: '0 15 * * *'   # 00:00 KST
    - cron: '0 23 * * *'   # 08:00 KST
    - cron: '0 7 * * *'    # 16:00 KST
  workflow_dispatch:
    inputs:
      skip_verify:
        description: '시드 RSS 검증 건너뛰기'
        type: boolean
        default: false

concurrency:
  # 이전 회차가 아직 돌고 있으면 겹치지 않게 한다 — 같은 스냅샷 시각이 두 번 찍히면
  # (video_id, ts) PK 때문에 한쪽이 덮어써져 Δt 가 왜곡된다.
  group: collect
  cancel-in-progress: false

permissions:
  contents: write   # 리포트 산출물 커밋용

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector
    env:
      PYTHONUTF8: '1'
      YT_MODE: live
      DB_MODE: live
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      YT_DAILY_QUOTA_LIMIT: '9500'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 게이트 (외부 호출 없음)
        run: python -m pytest -q
        # harness 모드 테스트다. 여기서 깨지면 수집을 돌릴 이유가 없다.
        env:
          YT_MODE: harness
          DB_MODE: harness

      # --- 핵심 경로: 실패하면 워크플로도 실패한다 ---------------------------
      - name: 수집
        run: python -m jobs.collect

      - name: 지수 산출·게시
        # 콜드스타트 초기에는 스냅샷이 1개뿐이라 0행이 나오고 exit 1 이 된다.
        # 그건 장애가 아니라 정상적인 과도기이므로 워크플로를 실패시키지 않는다.
        continue-on-error: true
        run: python -m jobs.compute --top 0

      # --- 유지보수 경로: 실패해도 수집을 실패시키지 않는다 -------------------
      - name: 시드 RSS 검증 (쿼터 0)
        if: ${{ github.event.inputs.skip_verify != 'true' }}
        continue-on-error: true
        working-directory: .
        run: python tools/verify_seeds.py --delay 0.3

      - name: 리포트 생성
        continue-on-error: true
        working-directory: .
        run: |
          python tools/gen_seeds_review.py
          python tools/gen_admin.py
          python tools/gen_progress.py

      # 영상 제목이 담긴 산출물은 **커밋하지 않는다**.
      # git 이력은 지워도 남으므로, 30일 보관 정책(YouTube ToS)을 지키려는 purge 잡과
      # 정면으로 어긋난다. 아티팩트는 보관 기간이 지나면 자동 삭제된다.
      - name: 검토 산출물 업로드 (아티팩트, 자동 만료)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: seed-review
          path: |
            docs/seeds_review.html
            docs/seeds_verdicts.json
          retention-days: 14
          if-no-files-found: ignore

      # 커밋하는 것은 **YouTube 파생 데이터가 없는 문서형 산출물**만이다.
      - name: 문서형 리포트 커밋
        continue-on-error: true
        working-directory: .
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/progress.html docs/admin.html
          git diff --staged --quiet || git commit -m "chore: 진행·운영 리포트 갱신 [skip ci]"
          git push

      - name: 요약
        if: always()
        working-directory: .
        run: |
          echo "### 수집 회차 $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 수집: ${{ steps.collect.outcome || 'see log' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 상세는 운영 콘솔(docs/admin.html)에서 확인" >> $GITHUB_STEP_SUMMARY
